id: agent-quiver/pack-routing
version: 0.1.1
title: Routing pack
card: 'Any multi-step task: find, pick and combine the right skills and rules from your quiver as the work moves, and cite them.'
description: 'How an agent routes a task to expertise with the quiver it already has: frame each phase as a task type,
  search, keep only what fits (rules always), read only what is needed, surface conflicts and cite every artifact with
  its version. The route skill follows the expertise-routing rulebook; evals/ holds the measured baseline.'
